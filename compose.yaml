services:
  postgres:
    image: postgres:17-alpine
    container_name: banking-concierge-db
    environment:
      POSTGRES_DB: concierge
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - concierge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concierge -d concierge"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  concierge-postgres:
